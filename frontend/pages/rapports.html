<section class="page-section">
  <div class="rapports-kpi kpi-banner stagger">
    <div class="kpi-card safe">
      <div class="kpi-card__value" id="rapTotalRapports">--</div>
      <div class="kpi-card__label" data-i18n="rapports.rapports_precedents">Rapports générés</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-card__value" id="rapDernierType">--</div>
      <div class="kpi-card__label" data-i18n="rapports.type_rapport">Dernier type</div>
    </div>
  </div>

  <div class="rapports-grid">
    <div class="rapports-types">
      <h3 data-i18n="rapports.generer_rapport">Générer un rapport</h3>
      <div class="rapport-type-cards">
        <button class="rapport-type-card" data-type="quotidien" type="button">
          <i data-lucide="calendar"></i>
          <span data-i18n="rapports.quotidien">Quotidien</span>
          <small data-i18n="rapports.dernieres_24h">Dernières 24h</small>
        </button>
        <button class="rapport-type-card" data-type="hebdomadaire" type="button">
          <i data-lucide="calendar-days"></i>
          <span data-i18n="rapports.hebdomadaire">Hebdomadaire</span>
          <small data-i18n="rapports.7_derniers_jours">7 derniers jours</small>
        </button>
        <button class="rapport-type-card" data-type="mensuel" type="button">
          <i data-lucide="calendar-range"></i>
          <span data-i18n="rapports.mensuel">Mensuel</span>
          <small data-i18n="rapports.30_derniers_jours">30 derniers jours</small>
        </button>
        <button class="rapport-type-card" data-type="annuel" type="button">
          <i data-lucide="calendar-x2"></i>
          <span data-i18n="rapports.annuel">Annuel</span>
          <small data-i18n="rapports.365_derniers_jours">365 derniers jours</small>
        </button>
      </div>

      <div class="rapport-custom">
        <label class="field">
          <span class="field__label" data-i18n="rapports.type_rapport">Type</span>
          <select id="typeRapport" class="field__input">
            <option value="quotidien" data-i18n="rapports.quotidien">Quotidien</option>
            <option value="hebdomadaire" data-i18n="rapports.hebdomadaire">Hebdomadaire</option>
            <option value="mensuel" data-i18n="rapports.mensuel">Mensuel</option>
            <option value="annuel" data-i18n="rapports.annuel">Annuel</option>
          </select>
        </label>
        <div class="rapport-dates">
          <label class="field">
            <span class="field__label" data-i18n="rapports.date_debut">Date début</span>
            <input type="date" id="rapportDateDebut" class="field__input">
          </label>
          <label class="field">
            <span class="field__label" data-i18n="rapports.date_fin">Date fin</span>
            <input type="date" id="rapportDateFin" class="field__input">
          </label>
        </div>
        <button class="btn btn-primary" id="btnGenererRapport" type="button" style="justify-content:center;">
          <i data-lucide="file-text"></i><span data-i18n="rapports.generer">Générer le rapport</span>
        </button>
      </div>
    </div>

    <!-- Report Result -->
    <div class="rapport-resultat" id="rapportResultat" style="display:none;">
      <div id="rapportContent"></div>
      <div class="rapport-actions">
        <button class="btn btn-outline" id="btnExportRapportPDF" type="button"><i data-lucide="download"></i><span data-i18n="rapports.exporter_pdf">Exporter PDF</span></button>
        <button class="btn btn-outline" id="btnExportRapportExcel" type="button"><i data-lucide="table"></i><span data-i18n="historique.export_excel">Excel</span></button>
      </div>
    </div>
  </div>

  <div class="table-wrap" style="margin-top:24px;">
    <h3 style="padding:18px 24px 0;" data-i18n="rapports.rapports_precedents">Rapports précédents</h3>
    <table class="table">
      <thead>
        <tr>
          <th data-i18n="rapports.type">Type</th>
          <th data-i18n="rapports.periode">Période</th>
          <th data-i18n="rapports.genere_le">Généré le</th>
          <th data-i18n="rapports.voir">Action</th>
        </tr>
      </thead>
      <tbody id="tbodyRapports">
        <tr><td colspan="4" class="table__empty" data-i18n="rapports.aucun_rapport">Aucun rapport</td></tr>
      </tbody>
    </table>
  </div>
</section>

<style>
.rapports-types h3 { margin-bottom: 16px; }
.rapport-type-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.rapport-type-card {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 20px 12px; background: var(--bg-primary); border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg); cursor: pointer; transition: all var(--transition-base);
  color: var(--text-secondary); font-family: var(--font-sans);
}
.rapport-type-card:hover { border-color: var(--accent-primary); color: var(--accent-primary); background: var(--accent-primary-soft); transform: translateY(-2px); }
.rapport-type-card.selected { border-color: var(--accent-primary); background: var(--accent-primary-soft); color: var(--accent-primary); }
.rapport-type-card i { width: 24px; height: 24px; }
.rapport-type-card span { font-weight: 600; font-size: 0.85rem; }
.rapport-type-card small { font-size: 0.7rem; color: var(--text-dim); }
.rapport-dates { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.rapport-custom { display: flex; flex-direction: column; gap: 12px; }
.rapport-actions { display: flex; gap: 8px; margin-top: 16px; }
.rapport-resultat { padding: 24px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-xl); }
.rapport-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.rapport-stat { text-align: center; padding: 16px; background: var(--bg-primary); border-radius: var(--radius-md); }
.rapport-stat__value { font-size: 1.4rem; font-weight: 700; color: var(--accent-primary); font-family: var(--font-mono); }
.rapport-stat__label { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; }
@media (max-width: 768px) { .rapport-type-cards { grid-template-columns: repeat(2, 1fr); } .rapport-stats-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
